<!doctype html>
<html lang="ja">
<head>
  <link rel="manifest" href="./manifest.json">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#666666">
  <meta name="description" content="的中率を記録するシンプルなカウンター">
  <link rel="manifest" href="manifest.webmanifest">
  <title>的中率カウンター</title>
  <style>
    :root { color-scheme: light; --gray:#777; --line:#c8c8c8; --bg:#f5f5f5; }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:18px 14px calc(24px + env(safe-area-inset-bottom));
      background:var(--bg); color:#222;
      font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
    }
    main { width:min(100%,560px); margin:0 auto; }
    .panel {
      background:#fff; border:1px solid #ddd; border-radius:18px;
      padding:18px 14px; box-shadow:0 2px 10px #0000000a;
    }
    .rate-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .rate-wrap { flex:1; text-align:center; }
    .rate { font-size:clamp(32px,9vw,44px); font-weight:750; line-height:1.05; font-variant-numeric:tabular-nums; }
    .sub { color:#777; font-size:12px; margin-top:5px; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; }
    .skip {
      border:1px solid #bbb; background:#fff; color:#333; border-radius:10px;
      padding:10px 14px; min-height:44px; font-weight:600;
    }
    .buttons { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .count {
      border:0; background:var(--gray); color:white; border-radius:14px;
      min-height:116px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:7px;
    }
    .count:active { background:#5d5d5d; transform:scale(.985); }
    .count .name { font-size:20px; font-weight:700; }
    .count .number { font-size:30px; font-weight:750; font-variant-numeric:tabular-nums; }
    .total { text-align:center; color:#666; font-size:13px; margin:13px 0 16px; }
    h2 { font-size:15px; margin:0 0 10px; }
    #history { display:flex; align-items:flex-start; gap:7px; overflow-x:auto; padding:1px 0 8px; min-height:270px; }
    .history-col {
      flex:0 0 28px; width:28px; display:grid;
      grid-template-rows:repeat(12,21px); align-content:start;
    }
    .cell { height:21px; display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; }
    .cell.hit { color:#24834b; }
    .cell.miss { color:#c43d3d; }
    .cell.skip { color:#777; }
    .cell:nth-child(4), .cell:nth-child(8) { border-bottom:1px solid var(--line); }
    .reset {
      width:100%; margin-top:15px; min-height:44px; border:1px solid #bbb;
      background:white; color:#444; border-radius:10px;
    }
    .hint { color:#888; font-size:11px; text-align:center; margin:12px 0 0; }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <div class="rate-row">
      <div class="rate-wrap">
        <div class="rate" id="rate">0.0%</div>
        <div class="sub">的中率</div>
      </div>
      <button class="skip" id="skip">スキップ</button>
    </div>

    <div class="buttons">
      <button class="count" id="hit" aria-label="的中を記録">
        <span class="name">的中</span><span class="number" id="hitCount">0回</span>
      </button>
      <button class="count" id="miss" aria-label="外れを記録">
        <span class="name">外れ</span><span class="number" id="missCount">0回</span>
      </button>
    </div>

    <div class="total" id="total">判定合計：0回　スキップ：0回</div>
    <h2>履歴（古い順）</h2>
    <div id="history" aria-label="操作履歴"></div>
    <button class="reset" id="reset">リセット（履歴も削除）</button>
    <p class="hint">記録はこの端末のブラウザ内に自動保存されます。</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
